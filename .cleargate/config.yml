# ClearGate per-repo configuration.
# See cleargate-planning/.cleargate/config.example.yml for the full schema.

wiki:
  index_token_ceiling: 8000
  # CR-002: raised from default 50 to accommodate the full story corpus (136 stories).
  bucket_pagination_ceiling: 200
  # 2026-05-31: stories are no longer compiled into the wiki — too granular/numerous
  # for the awareness layer. Every other bucket is still ingested. Stories continue
  # to sync to ClearGate via `cleargate push`; only the local wiki skips them.
  # This allowlist omits `stories` (and is the same default the scaffold ships).
  ingest_buckets:
    - epics
    - sprints
    - proposals
    - crs
    - bugs
    - initiatives
    - spikes

gates:
  # Meta-repo gate commands run cleargate-cli's node:test suite via `npm --prefix`
  # (the repo root is NOT an npm workspace — CR-077 fixed the prior broken
  # `--workspace=cleargate-cli` form). Concurrency lives in cleargate-cli's
  # package.json test script (--test-concurrency=1). vitest was removed in EPIC-028.
  precommit: "npm --prefix cleargate-cli run typecheck && npm --prefix cleargate-cli test"
  test: "npm --prefix cleargate-cli test"
  typecheck: "npm --prefix cleargate-cli run typecheck"
  lint: "npx cleargate wiki lint"

worktree:
  # Gitignored config roots provisioned into each new story worktree (CR-079).
  # Symlinked by default (worktree-root/<root> -> absolute repo-root/<root>);
  # use 'copy' mode for worktrees that need a divergent config.
  provision_config:
    - .env
  provision_mode: symlink   # symlink (default) | copy

vcs:
  # CR-107: sprint->main merge goes through a GitHub pull request. The PR is
  # opened at the start of Phase D (the walkthrough) and merged at Gate 4
  # close_sprint.mjs Step 2.8, instead of close_sprint.mjs verifying a purely
  # local `git merge`. Requires the `gh` CLI and a GitHub `origin` remote —
  # both present in this repo — and close_sprint.mjs fails closed if either
  # is missing. Left off for now (M4 plan's corrected file surface pins this
  # repo's value to false at merge time) — flip to true in a deliberate
  # follow-up once this Step 2.8 change has closed a sprint on the local path.
  sprint_pr: false
